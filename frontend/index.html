<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Stream Monitor — CFTV de Janelas (Acer)</title>

  <!-- PWA & iOS Safari Web App Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stream Monitor">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d1117">

  <!-- Anti-Cache & Auto-Update -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Icons -->
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">

  <link rel="stylesheet" href="/static/styles.css?v=20260828_v4">
</head>
<body>
  <!-- Header Topo -->
  <header>
    <div class="header-top">
      <div class="logo-area">
        <img src="/static/icon-192.png" alt="Logo" class="header-logo">
        <div class="brand-text">
          <h1>Stream Monitor</h1>
          <div class="connection-status">
            <span class="status-dot online" id="statusDot"></span>
            <span id="statusText">Host Acer Online</span>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button class="btn btn-icon" id="btnRefreshWindows" title="Recarregar Janelas">🔄</button>
        <button class="btn btn-primary" id="btnAddWindow">
          <span>➕</span> <span class="btn-text">Adicionar</span>
        </button>
      </div>
    </div>

    <!-- Barra de Métricas e Controles Rápidos -->
    <div class="metrics-bar">
      <div class="metric-pill">
        <span class="metric-label">CPU</span>
        <b class="metric-val" id="valCpu">0%</b>
      </div>
      <div class="metric-pill">
        <span class="metric-label">RAM</span>
        <b class="metric-val" id="valRam">0%</b>
      </div>
      <div class="metric-pill">
        <span class="metric-label">STREAMS</span>
        <b class="metric-val" id="valStreams">0</b>
      </div>
      <button class="btn btn-sm btn-primary" id="btnFpsToggle" title="Alternar Taxa de Quadros (Economia de Dados)">
        30 FPS
      </button>
      <div class="master-toggle-wrapper">
        <button class="btn btn-sm btn-outline-danger" id="btnMasterToggle">
          <span id="masterIcon">⏹</span> <span id="masterText">Parar Todos</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main>
    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📺</div>
      <h3>Nenhuma janela sendo transmitida</h3>
      <p>Toque em <b>"+ Adicionar"</b> para escolher janelas do Acer.</p>
      <button class="btn btn-primary btn-lg" id="btnEmptyAdd">
        ➕ Escolher Janela
      </button>
    </div>

    <!-- Grid de Cards de Streaming -->
    <div class="grid-container" id="gridContainer"></div>
  </main>

  <!-- Barra de Ações Fixa Inferior no Mobile (Bottom Action Bar) -->
  <nav class="mobile-bottom-bar">
    <button class="bottom-nav-item" id="btnBottomRefresh">
      <span class="nav-icon">🔄</span>
      <span class="nav-label">Atualizar</span>
    </button>
    <button class="bottom-nav-item bottom-nav-primary" id="btnBottomAdd">
      <span class="nav-icon">➕</span>
      <span class="nav-label">Nova Janela</span>
    </button>
    <button class="bottom-nav-item" id="btnBottomMaster">
      <span class="nav-icon" id="bottomMasterIcon">⏹</span>
      <span class="nav-label" id="bottomMasterText">Parar Todos</span>
    </button>
  </nav>

  <!-- Modal / Bottom Sheet de Seleção de Janelas -->
  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal-content">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <div class="modal-title-area">
          <h3>Janelas Disponíveis no Acer</h3>
          <span class="modal-subtitle">Selecione para transmitir ao vivo</span>
        </div>
        <button class="icon-btn close-btn" id="btnCloseModal">✕</button>
      </div>
      <div class="modal-body" id="windowListContainer">
        <div class="loading-state">
          <div class="spinner"></div>
          <span>Buscando janelas no X11...</span>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/app.js?v=20260828_v4"></script>
</body>
</html>
